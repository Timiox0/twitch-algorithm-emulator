<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Twitch Ranking HUD Overlay</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 8px;
      overflow: hidden;
      display: inline-block;
    }
  </style>
</head>
<body class="obs-overlay-mode">
  <div id="hudContainer"></div>

  <!-- Core Algorithm Scripts -->
  <script src="js/engine/fsm.js"></script>
  <script src="js/engine/mmoe.js"></script>
  <script src="js/engine/vst.js"></script>
  <script src="js/engine/twitch_connector.js"></script>
  <script src="js/engine/feature_extractor.js"></script>
  <script src="js/engine/category_benchmark.js"></script>
  <script src="js/engine/session_recorder.js"></script>
  <script src="js/engine/stream_state.js"></script>

  <!-- HUD Component -->
  <script src="js/ui/hud.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const hudContainer = document.getElementById('hudContainer');

        const urlParams = new URLSearchParams(window.location.search);
        const channel = urlParams.get('channel');
        const preset = urlParams.get('preset');
        const layoutMode = urlParams.get('layout') || urlParams.get('view') || 'full'; // 'full' | 'circle' | 'mini'

        // Adjust container width based on selected layout
        if (layoutMode === 'circle' || layoutMode === 'gauge') {
          hudContainer.style.width = '140px';
        } else if (layoutMode === 'mini' || layoutMode === 'bar') {
          hudContainer.style.width = '340px';
        } else {
          hudContainer.style.width = '380px';
        }

        const hud = new StreamHUD(hudContainer, {
          layoutMode: layoutMode,
          isCompact: layoutMode !== 'full',
          showAdvice: layoutMode === 'full'
        });

        let sseActive = false;
        let localStateManager = null;

        // 1. High-Speed Server-Sent Events (SSE) Live Sync
        // Receives exact state from the Master Dashboard with ZERO jitter
        try {
          const sse = new EventSource('/api/state/events');
          sse.onmessage = (evt) => {
            if (!evt.data) return;
            try {
              const report = JSON.parse(evt.data);
              if (report && report.scoreOverall !== undefined) {
                sseActive = true;
                hud.update(report);
              }
            } catch (err) {}
          };

          sse.onerror = () => {
            sseActive = false;
          };
        } catch (e) {
          console.warn('SSE not supported');
        }

        // 2. Fallback Poll (only active if SSE is not streaming)
        setInterval(async () => {
          if (!sseActive) {
            try {
              const res = await fetch(`/api/state/latest?_t=${Date.now()}`);
              if (res.ok) {
                const report = await res.json();
                if (report && report.scoreOverall !== undefined) {
                  hud.update(report);
                  return;
                }
              }
            } catch (e) {}

            // If server has no state, lazy-init standalone manager
            if (!localStateManager) {
              localStateManager = new StreamStateManager();
              localStateManager.addListener((report) => {
                if (!sseActive) hud.update(report);
              });
              if (channel) localStateManager.connectLiveChannel(channel);
              else if (preset) localStateManager.applyPreset(preset);
            }
          }
        }, 500);

      } catch (err) {
        console.error('Overlay init error:', err);
        const hudContainer = document.getElementById('hudContainer');
        if (hudContainer) {
          hudContainer.innerHTML = `<div style="background: rgba(244,63,94,0.2); border: 1px solid #f43f5e; color: #fff; padding: 12px; border-radius: 8px; font-family: sans-serif; font-size: 12px;"><strong>Ошибка оверлея:</strong> ${err.message}</div>`;
        }
      }
    });
  </script>
</body>
</html>
